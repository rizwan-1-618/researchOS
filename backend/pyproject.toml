[project]
name = "researchos"
version = "1.0.0"
description = "Research workspace for discovering, reading, and connecting academic literature."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.10",
  "httpx>=0.28",
  "redis>=5.2",
  "rq>=1.16",
  "boto3>=1.35",
  "pypdf>=5.1",
  "pgvector>=0.3.6",
  "fastembed>=0.4",
  "networkx>=3.4",
  "python-multipart>=0.0.17",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "fpdf2>=2.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
